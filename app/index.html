<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VieJob — Việc làm part-time cho sinh viên</title>
    <meta
      name="description"
      content="VieJob Marketplace kết nối sinh viên với việc làm bán thời gian tại các nhà tuyển dụng uy tín. Tìm việc theo ca làm, mức lương và khu vực — miễn phí cho sinh viên."
    />
    <meta
      name="keywords"
      content="việc làm sinh viên, part-time, làm thêm, việc làm theo ca, việc làm F&B, tuyển dụng sinh viên"
    />
    <meta name="author" content="VieJob Marketplace" />
    <meta name="theme-color" content="#18181b" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="VieJob Marketplace" />
    <meta
      property="og:title"
      content="VieJob — Việc làm part-time cho sinh viên"
    />
    <meta
      property="og:description"
      content="Nền tảng kết nối việc làm bán thời gian cho sinh viên và nhà tuyển dụng uy tín."
    />
    <meta property="og:image" content="/icons.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VieJob — Việc làm part-time cho sinh viên"
    />
    <meta
      name="twitter:description"
      content="Nền tảng kết nối việc làm bán thời gian cho sinh viên và nhà tuyển dụng uy tín."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Áp dụng sáng/tối trước khi React mount để tránh nháy giao diện (FOUC).
      // Giá trị mặc định "dark" phải khớp với ThemeProvider trong App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("vite-ui-theme");
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "dark";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(isDark ? "dark" : "light");
          root.style.colorScheme = isDark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#18181b" : "#ffffff");
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
