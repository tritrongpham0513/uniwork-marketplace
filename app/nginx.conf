# ---------------------------------------------------------------------
# VieJob Marketplace — Nginx reverse proxy
#
#   /            -> SPA (React Router fallback -> index.html)
#   /api/        -> backend:8080/api/   (Spring Boot API)
#   /ws/         -> backend:8080/ws/    (WebSocket thông báo realtime)
#   /swagger-ui  -> backend:8080  (tiện khi debug)
# ---------------------------------------------------------------------

upstream viejob_backend {
    server backend:8080;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API proxy ---------------------------------------------------
    location /api/ {
        proxy_pass         http://viejob_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- WebSocket proxy (thông báo realtime) ------------------------
    # Cần nâng cấp HTTP -> WebSocket (Upgrade/Connection) và timeout dài
    # hơn để giữ kết nối sống.
    location /ws/ {
        proxy_pass         http://viejob_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Tài liệu API ------------------------------------------------
    location ~ ^/(swagger-ui|v3/api-docs|api-docs) {
        proxy_pass         http://viejob_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Tài nguyên tĩnh có hash trong tên ---------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
