# ---------------------------------------------------------------------
# Profile PROD — dùng khi deploy lên Render (SPRING_PROFILES_ACTIVE=prod)
#
# Nguyên tắc: production KHÔNG được chạy bằng giá trị mặc định.
# Mọi secret bắt buộc phải lấy từ biến môi trường; nếu thiếu, ứng dụng
# fail-fast ngay lúc khởi động (không deploy "thành công" với secret rỗng).
#
# Biến môi trường bắt buộc (xem render.yaml để biết chính xác giá trị):
#   JWT_SECRET               — khóa ký HS256, >= 32 byte
#   ADMIN_INITIAL_PASSWORD   — mật khẩu tài khoản admin khởi tạo
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   R2_ENDPOINT / R2_ACCESS_KEY / R2_SECRET_KEY
#
# File này được Spring Boot tự động nạp khi profile `prod` bật — không
# cần khai báo `spring.config.activate.on-profile`.
# ---------------------------------------------------------------------

server:
  # Render inject PORT=10000. Phải bind 0.0.0.0 (Render quét port từ
  # network namespace khác, chỉ bind loopback sẽ không thấy).
  port: ${PORT:8080}
  address: 0.0.0.0
  # Render dừng container bằng SIGTERM — cần thời gian đóng socket WebSocket
  # và các request đang chạy.
  shutdown: graceful

spring:
  # Flyway: DB Enzonic "ngủ" sau 5' không có kết nối => lần đầu Flyway
  # không kết nối được. Retry với backoff luỹ thừa để deploy không chết.
  flyway:
    connect-retries: 10
    connect-retries-interval: 5

  datasource:
    hikari:
      # Enzonic tính phí theo "compute thức" — DB ngủ sau 5' không kết nối.
      # Pool mở kết nối ngay lúc app khởi động sẽ đánh thức DB, nhưng
      # lần đầu có thể mất vài giây cho tới khi compute của DB bật.
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      # Pool nhỏ: Render free chỉ 0.1 CPU, nhiều connection hơn chỉ gây
      # tranh chấp.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    # KHÔNG có giá trị mặc định — thiếu là startup fail.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@viejob.vn}
    # KHÔNG có giá trị mặc định — thiếu là startup fail.
    initial-password: ${ADMIN_INITIAL_PASSWORD}

  # Mật khẩu cho tài khoản demo seed sẵn (V3 tạo user với
  # password_hash = 'SEED_PENDING'). DemoAccountInitializer gán lại mật
  # khẩu BCrypt khi app khởi động.
  demo:
    student-password: ${DEMO_STUDENT_PASSWORD:Student@123}
    employer-password: ${DEMO_EMPLOYER_PASSWORD:Employer@123}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@123}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Kiểm duyệt nội dung tin tuyển dụng bằng AI — tắt mặc định ở production.
  # Bật bằng cách đặt AI_ENABLED=true + GEMINI_API_KEY trong biến môi trường.
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    gemini-api-key: ${GEMINI_API_KEY:}

  storage:
    r2:
      endpoint: ${R2_ENDPOINT}
      access-key: ${R2_ACCESS_KEY}
      secret-key: ${R2_SECRET_KEY}
      bucket-public: ${R2_BUCKET_PUBLIC:viejob-public}
      bucket-private: ${R2_BUCKET_PRIVATE:viejob-private}
      public-base-url: ${R2_PUBLIC_BASE_URL:}

logging:
  level:
    root: INFO
    com.uniwork: INFO
    org.springframework.security: WARN
