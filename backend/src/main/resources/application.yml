server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: uniwork-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
  # Cấu hình kết nối Cơ sở dữ liệu MySQL 8.x
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parttime_marketplace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Cấu hình Flyway Database Migration: Tự động khởi tạo và cập nhật schema CSDL
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  # Cấu hình Hibernate JPA: strictly validate theo schema_parttime_marketplace_mysql.sql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  # Cấu hình JavaMailSender gửi email kích hoạt qua Gmail SMTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      # Giới hạn dung lượng multipart (Spring) — lớn hơn giới hạn nghiệp vụ để
      # backend tự trả lỗi 400 với thông báo tiếng Việt thay vì lỗi kỹ thuật.
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 giờ
  mail:
    from: ${APP_MAIL_FROM:UniWork Marketplace <no-reply@uniwork.vn>}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # URL công khai dùng để tạo link tải file (ảnh, CV) — frontend nhúng thẳng
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    # Nơi lưu file upload: Cloudflare R2 (S3-compatible).
    # Upload đi qua luồng presigned PUT — browser PUT thẳng lên R2,
    # backend không nhận nội dung file.
    #
    # R2 free tier: 10 GB storage + egress miễn phí. Không bị mất dữ liệu khi
    # container restart trên PaaS có disk ephemeral (Render/Railway).
    # Tiền tố URL phục vụ file
    public-path: ${APP_STORAGE_PUBLIC_PATH:/api/v1/files}
    r2:
      # Endpoint dạng https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      # Bucket chứa ảnh công khai (avatar / logo) — có thể bật CDN
      bucket-public: ${R2_BUCKET_PUBLIC:viejob-public}
      # Bucket chứa CV — KHÔNG public, tải qua presigned URL có hạn
      bucket-private: ${R2_BUCKET_PRIVATE:viejob-private}
      # Domain CDN phục vụ bucket-public (rỗng → dùng endpoint R2 trực tiếp)
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      # Thời hạn (phút) của presigned PUT — client phải upload trong khoảng này
      presign-put-ttl-minutes: ${R2_PRESIGN_PUT_TTL_MINUTES:10}
      # Thời hạn (phút) của presigned GET (tải CV)
      presign-get-ttl-minutes: ${R2_PRESIGN_GET_TTL_MINUTES:5}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
  # Cấu hình tài khoản Quản trị viên khởi tạo qua biến môi trường (không hardcode)
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@uniwork.vn}
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123456}

# Cấu hình ghi log
logging:
  level:
    root: INFO
    com.uniwork: DEBUG
    org.springframework.security: INFO

# Cấu hình Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
