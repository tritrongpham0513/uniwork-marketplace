# ---------------------------------------------------------------------
# VieJob Marketplace — Docker Compose
#
#   mysql    : MySQL 8.4 (port 3306)
#   backend  : Spring Boot API  (port 8080)
#   frontend : Nginx + SPA      (port 8000, reverse proxy /api -> backend)
#
# Chạy:  docker compose up --build
# Test:  http://localhost:8000
# ---------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.4
    container_name: viejob-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: parttime_marketplace
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viejob-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parttime_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_PROFILES_ACTIVE: docker
      # Khóa ký JWT — đổi trong môi trường thật
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # Tài khoản demo
      ADMIN_INITIAL_EMAIL: admin@viejob.vn
      ADMIN_INITIAL_PASSWORD: Admin@123
      DEMO_STUDENT_PASSWORD: Student@123
      DEMO_EMPLOYER_PASSWORD: Employer@123
      DEMO_ADMIN_PASSWORD: Admin@123
      # Cho phép truy cập từ frontend trong compose
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:5173,http://localhost:3000
      # Lưu file upload (CV / ảnh / logo) trên Cloudflare R2 (S3-compatible).
      # File KHÔNG lưu trong container → không mất khi restart / rebuild.
      R2_ENDPOINT: ${R2_ENDPOINT:?Cần thiết lập R2_ENDPOINT trong .env}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?Cần thiết lập R2_ACCESS_KEY trong .env}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?Cần thiết lập R2_SECRET_KEY trong .env}
      R2_BUCKET_PUBLIC: ${R2_BUCKET_PUBLIC:-viejob-public}
      R2_BUCKET_PRIVATE: ${R2_BUCKET_PRIVATE:-viejob-private}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PRESIGN_PUT_TTL_MINUTES: ${R2_PRESIGN_PUT_TTL_MINUTES:-10}
      R2_PRESIGN_GET_TTL_MINUTES: ${R2_PRESIGN_GET_TTL_MINUTES:-5}
      # URL công khai dùng để tạo link tải file
      APP_PUBLIC_BASE_URL: http://localhost:8080
      TZ: UTC
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: viejob-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    environment:
      TZ: UTC

volumes:
  mysql-data:
