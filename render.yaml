services:
  # ---------------------------------------------------------------------
  # VieJob Marketplace — Backend API (Spring Boot 3.3 / Java 17)
  #
  # Deploy: Render Dashboard -> New -> Blueprint -> chọn repo
  #         -> chọn nhánh `dev-viejob` -> Apply
  #
  # Render không có runtime Java native => bắt buộc dùng Docker.
  # `plan: free` = 0.1 CPU / 512 MB RAM / 750 giờ instance mỗi tháng.
  # ---------------------------------------------------------------------
  - type: web
    name: viejob-api
    runtime: docker
    plan: free
    region: singapore
    branch: dev-viejob
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/public/categories
    envVars:
      # --- Spring profile -----------------------------------------------
      # `prod` kích hoạt `application-prod.yml` (bắt buộc secret thật).
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Render inject `PORT=10000`; Spring đọc `server.port=${PORT:8080}`.

      # --- JVM tuning cho 512 MB RAM ------------------------------------
      # Mặc định JVM chỉ lấy 25% RAM làm heap (128 MB) => OOM.
      # 60% heap + SerialGC (chỉ 1 CPU) + giảm code cache.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=48m

      - key: TZ
        value: UTC

      # --- Database (Enzonic MySQL 8.4, TLS bắt buộc) ------------------
      # Thay <host> bằng hostname trong Enzonic Console (dạng
      # <ten-db>.db.enzonic.com). Database mặc định tên `main`.
      - key: DB_URL
        value: jdbc:mysql://<enzonic-host>:3306/main?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - key: DB_USERNAME
        value: main
      - key: DB_PASSWORD
        sync: false

      # --- Secret (KHÔNG hardcode trong repo) ---------------------------
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        value: admin@viejob.vn
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

      # --- Tài khoản demo (seed V3 dùng password_hash = SEED_PENDING) ----
      # DemoAccountInitializer gán mật khẩu BCrypt cho các tài khoản demo.
      - key: DEMO_STUDENT_PASSWORD
        value: Student@123
      - key: DEMO_EMPLOYER_PASSWORD
        value: Employer@123
      - key: DEMO_ADMIN_PASSWORD
        value: Admin@123

      # --- URL công khai ------------------------------------------------
      # Link trong email xác thực. Sửa thành https://api-job.viejoy.io.vn
      # sau khi gắn custom domain.
      - key: APP_BASE_URL
        value: https://viejob-api.onrender.com
      - key: APP_PUBLIC_BASE_URL
        value: https://viejob-api.onrender.com

      # --- CORS ---------------------------------------------------------
      # Danh sách origin được phép gọi API. Thêm domain Vercel + domain
      # riêng khi đã cấu hình. Dùng "," để tách.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:8000,http://localhost:8080,https://viejob-api.onrender.com,https://viejob.vercel.app

      # --- Cloudflare R2 (lưu CV / ảnh đại diện / logo) ------------------
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_PUBLIC
        value: viejob-public
      - key: R2_BUCKET_PRIVATE
        value: viejob-private
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_PRESIGN_PUT_TTL_MINUTES
        value: "10"
      - key: R2_PRESIGN_GET_TTL_MINUTES
        value: "5"

      # --- Email --------------------------------------------------------
      # Render Free chặn outbound SMTP (25/465/587) -> ưu tiên Resend HTTP API (443).
      # Tạo API key tại https://resend.com/api-keys và dán vào Render Dashboard (RESEND_API_KEY).
      # KHÔNG ghi API key trực tiếp vào file này để tránh lộ secret trên Git.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: VieJob Marketplace <no-reply@noreply.viejoy.io.vn>
      # Fallback SMTP (chỉ chạy được nếu nâng cấp Render trả phí mở cổng 587)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: APP_MAIL_FROM
        value: VieJob Marketplace <no-reply@viejob.vn>

      # --- Google OAuth -------------------------------------------------
      - key: GOOGLE_CLIENT_ID
        value: 453610447705-f8tsl8tu5psji76slhhupkj02o5m81uc.apps.googleusercontent.com
